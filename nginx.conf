# Non-root nginx config for the static MemeScan Astro build.
# Everything nginx writes lives under /tmp so it runs as an unprivileged user,
# and the server listens on 8080 (an unprivileged port) behind the host's
# Caddy reverse proxy.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for a non-root process.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    access_log  /dev/stdout;
    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/xml+rss text/xml text/javascript
                      image/svg+xml application/wasm;

    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Astro builds directory-style routes (dist/<route>/index.html),
        # so try the file, then the directory index, then a real 404.
        location / {
            try_files $uri $uri/ =404;
        }

        # Long-cache the fingerprinted build assets.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
